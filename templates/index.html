<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blue Gradient · AI Document Assistant</title>

  <!-- MathJax 3 + mhchem -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        packages: {'[+]': ['mhchem']}
      },
      loader: {load: ['[tex]/mhchem']},
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      chtml: { scale: 1.05 }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    /* ============================================================
       THEME — White + Blue Gradient (refined)
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-white:       #ffffff;
      --bg-soft:        #f8fbff;
      --bg-surface:     #ffffff;
      --bg-elevated:    #f0f6ff;

      --border-light:   #e4edf9;
      --border-mid:     #cfe0f5;
      --border-blue:    #b8d4f0;

      --text-primary:   #0f172a;
      --text-secondary: #475569;
      --text-muted:     #94a3b8;

      --blue-1: #1e40af;
      --blue-2: #2563eb;
      --blue-3: #3b82f6;
      --blue-4: #60a5fa;
      --blue-5: #93c5fd;

      --accent:         #2563eb;
      --accent-soft:    rgba(37, 99, 235, 0.08);
      --accent-glow:    rgba(37, 99, 235, 0.25);

      --user-bubble:    linear-gradient(135deg, #1e40af, #2563eb);
      --ai-bubble:      #ffffff;

      --shadow-sm: 0 1px 3px rgba(30, 64, 175, 0.06);
      --shadow-md: 0 8px 24px rgba(30, 64, 175, 0.08);
      --shadow-lg: 0 20px 50px rgba(30, 64, 175, 0.12);
      --shadow-xl: 0 24px 60px rgba(30, 64, 175, 0.16);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-white);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ---- soft blue gradient background ---- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 0% -10%, rgba(59, 130, 246, 0.08), transparent 60%),
        radial-gradient(ellipse 70% 50% at 100% 0%, rgba(37, 99, 235, 0.06), transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 110%, rgba(96, 165, 250, 0.08), transparent 60%),
        linear-gradient(180deg, #ffffff, #f8fbff);
    }

    /* ---- top blue ribbon ---- */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      z-index: 100;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--blue-5) 10%,
        var(--blue-4) 30%,
        var(--blue-3) 50%,
        var(--blue-2) 70%,
        var(--blue-1) 90%,
        transparent 100%);
      background-size: 200% 100%;
      animation: ribbonFlow 6s linear infinite;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
    }

    @keyframes ribbonFlow {
      0%   { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      background: transparent;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-light);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      transition: transform 0.25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 6px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue-2), var(--blue-4));
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.4), transparent 70%);
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      line-height: 1.2;
      color: var(--text-primary);
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-top: 4px;
    }

    .new-chat-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--blue-2), var(--blue-3));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
    }

    .new-chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    }

    .side-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      font-weight: 500;
      font-family: inherit;
      box-shadow: var(--shadow-sm);
    }

    .side-toggle:hover {
      border-color: var(--border-blue);
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .side-toggle.active {
      border-color: var(--blue-3);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(96, 165, 250, 0.06));
      color: var(--blue-2);
      box-shadow: 0 0 24px rgba(37, 99, 235, 0.15);
    }

    #webState {
      font-weight: 700;
      font-size: 10.5px;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      font-family: 'SF Mono', monospace;
    }

    .side-toggle.active #webState { color: var(--blue-2); }

    .side-info {
      margin-top: auto;
      padding: 18px 8px 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.9;
      border-top: 1px solid var(--border-light);
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.3px;
    }

    .side-info b { color: var(--text-secondary); font-weight: 600; }

    /* ---------- MAIN ---------- */
    .main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: transparent;
    }

    .main-header {
      padding: 22px 36px 18px;
      border-bottom: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 2;
      flex-shrink: 0;
    }

    .main-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-primary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue-2);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12), 0 0 14px var(--blue-2);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12), 0 0 14px var(--blue-2); }
      50%      { opacity: 0.7; box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.06), 0 0 20px var(--blue-2); }
    }

    .main-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      font-weight: 500;
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.3px;
    }

    /* ---------- THREAD ---------- */
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 32px 36px 160px;
      scroll-behavior: smooth;
      position: relative;
    }

    .thread::-webkit-scrollbar { width: 8px; }
    .thread::-webkit-scrollbar-track { background: transparent; }
    .thread::-webkit-scrollbar-thumb {
      background: var(--border-mid);
      border-radius: 8px;
    }
    .thread::-webkit-scrollbar-thumb:hover { background: var(--blue-4); }

    /* ---------- EMPTY STATE ---------- */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty-icon {
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.10), rgba(96, 165, 250, 0.08));
      border: 1px solid var(--border-blue);
      display: grid;
      place-items: center;
      font-size: 38px;
      color: var(--blue-2);
      box-shadow: 0 12px 40px rgba(37, 99, 235, 0.15);
      margin-bottom: 26px;
      position: relative;
    }

    .empty-icon::after {
      content: "";
      position: absolute;
      inset: -30px;
      border-radius: 50px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08), transparent 70%);
      z-index: -1;
    }

    .empty h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 10px;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .empty p {
      font-size: 14px;
      margin: 0 0 32px;
      max-width: 520px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 620px;
      width: 100%;
    }

    .suggestion {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      font-family: inherit;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .suggestion::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--blue-2), var(--blue-4));
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.25s ease;
    }

    .suggestion:hover {
      border-color: var(--border-blue);
      color: var(--text-primary);
      background: var(--bg-elevated);
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(37, 99, 235, 0.12);
    }

    .suggestion:hover::before { transform: scaleY(1); }

    .suggestion b {
      display: block;
      color: var(--text-primary);
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 13.5px;
    }

    .suggestion:hover b { color: var(--blue-2); }

    /* ---------- MESSAGES ---------- */
    .msg {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      animation: msgIn 0.35s ease;
      max-width: 100%;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 16px;
      color: #fff;
      font-weight: 700;
      font-family: 'SF Mono', monospace;
    }

    .msg.user .avatar {
      background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
    }

    .msg.ai .avatar {
      background: linear-gradient(135deg, var(--blue-3), var(--blue-4));
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    .bubble-wrap {
      max-width: calc(100% - 70px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      font-size: 14.5px;
      line-height: 1.75;
      overflow-wrap: anywhere;
      position: relative;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.28);
    }

    .msg.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border-light);
      border-bottom-left-radius: 6px;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .bubble-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .att-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.3);
      font-family: 'SF Mono', monospace;
    }

    .bubble-img {
      display: block;
      max-width: 280px;
      max-height: 260px;
      border-radius: var(--radius-md);
      margin-top: 10px;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.25);
      border: 1px solid var(--border-light);
    }

    /* ---------- EXTRACT BOX ---------- */
    .extract-box {
      background: var(--bg-soft);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      margin-top: 14px;
      overflow: hidden;
    }

    .extract-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      background: var(--bg-elevated);
      user-select: none;
      transition: all 0.2s ease;
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.4px;
    }

    .extract-head:hover {
      background: rgba(37, 99, 235, 0.06);
      color: var(--blue-2);
    }

    .extract-head .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .extract-head .chev {
      transition: transform 0.25s ease;
      font-size: 10px;
      color: var(--blue-2);
    }

    .extract-box.open .chev { transform: rotate(90deg); }

    .extract-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--text-secondary);
      background: #ffffff;
      border-top: 1px solid var(--border-light);
    }

    .extract-box.open .extract-body {
      max-height: 340px;
      overflow-y: auto;
    }

    .extract-body pre {
      margin: 0;
      padding: 16px 18px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: #334155;
    }

    /* ---------- MESSAGE TOOLS ---------- */
    .msg-tools {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
      padding: 0 4px;
    }

    .msg:hover .msg-tools { opacity: 1; }

    .tool-btn {
      background: transparent;
      border: 1px solid var(--border-light);
      color: var(--text-muted);
      padding: 6px 13px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'SF Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: all 0.18s ease;
    }

    .tool-btn:hover {
      color: var(--blue-2);
      border-color: var(--blue-3);
      background: var(--accent-soft);
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.12);
    }

    /* ---------- TYPING ---------- */
    .typing {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 6px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue-3);
      animation: bounceBlue 1.4s infinite ease-in-out;
      opacity: 0.4;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.5);
    }

    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounceBlue {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%           { transform: translateY(-8px); opacity: 1; }
    }

    /* ---------- STATUS ---------- */
    .extract-status {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.3px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-mid);
      border-top-color: var(--blue-2);
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- COMPOSER ---------- */
    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 36px 28px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.9) 35%,
        #ffffff 65%);
      z-index: 3;
    }

    .composer {
      max-width: 860px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-lg);
      padding: 14px 14px 14px 18px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      box-shadow: var(--shadow-lg);
    }

    .composer:focus-within {
      border-color: var(--blue-3);
      box-shadow:
        0 24px 60px rgba(37, 99, 235, 0.12),
        0 0 0 3px rgba(37, 99, 235, 0.08),
        0 0 48px rgba(37, 99, 235, 0.08);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 2px 10px;
      min-height: 0;
    }

    .badge-row:empty { display: none; }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(96, 165, 250, 0.06));
      color: var(--blue-2);
      padding: 7px 14px 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      border: 1px solid rgba(37, 99, 235, 0.2);
      font-family: 'SF Mono', monospace;
      letter-spacing: 0.3px;
    }

    .file-badge button {
      border: none;
      background: rgba(37, 99, 235, 0.1);
      color: var(--blue-2);
      cursor: pointer;
      font-size: 11px;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      line-height: 1;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .file-badge button:hover { background: rgba(37, 99, 235, 0.2); }

    #imagePreview {
      display: none;
      max-width: 130px;
      max-height: 130px;
      margin: 0 2px 10px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }

    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      padding: 10px 6px;
      min-height: 34px;
      max-height: 180px;
      font-family: inherit;
      background: transparent;
      color: var(--text-primary);
      caret-color: var(--blue-2);
      line-height: 1.6;
    }

    textarea::placeholder { color: var(--text-muted); }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      background: var(--bg-soft);
      color: var(--text-secondary);
    }

    .icon-btn:hover {
      background: var(--accent-soft);
      color: var(--blue-2);
      border-color: var(--blue-3);
      box-shadow: 0 0 24px rgba(37, 99, 235, 0.15);
      transform: translateY(-1px);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue-2), var(--blue-3));
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.45);
      background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    }

    .send-btn:disabled {
      background: var(--bg-elevated);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .send-btn.stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      box-shadow: 0 8px 28px rgba(239, 68, 68, 0.4);
    }

    #fileInput { display: none; }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }

      .sidebar {
        display: none;
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        z-index: 200;
        box-shadow: 24px 0 70px rgba(30, 64, 175, 0.15);
        border-right: 1px solid var(--border-mid);
      }

      .sidebar.open { display: flex; }

      .thread { padding: 24px 18px 160px; }
      .composer-wrap { padding: 12px 16px 22px; }
      .main-header { padding: 16px 20px 14px; }
      .suggestions { grid-template-columns: 1fr; }
      .empty h2 { font-size: 20px; }
    }

    .menu-btn {
      display: none;
      position: absolute;
      top: 18px;
      left: 18px;
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: #ffffff;
      cursor: pointer;
      font-size: 18px;
      z-index: 5;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .menu-btn:hover {
      border-color: var(--blue-3);
      color: var(--blue-2);
      box-shadow: 0 0 24px rgba(37, 99, 235, 0.15);
    }

    @media (max-width: 900px) {
      .menu-btn { display: grid; place-items: center; }
      .main-title { margin-left: 52px; }
    }

    /* user bubble mathjax color */
    .msg.user .bubble mjx-container { color: #ffffff; }
    /* ai bubble math */
    .msg.ai .bubble mjx-container { color: var(--text-primary); }

    ::selection {
      background: rgba(37, 99, 235, 0.2);
      color: var(--text-primary);
    }
    /* ============================================================
   BRAND — redesigned
   ============================================================ */
.brand {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 4px 22px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border-light);
}

/* soft glow behind the brand */
.brand::after {
  content: "";
  position: absolute;
  left: -20px;
  top: -10px;
  width: 140px;
  height: 80px;
  background: radial-gradient(circle at 30% 40%,
              rgba(37, 99, 235, 0.10), transparent 70%);
  filter: blur(8px);
  pointer-events: none;
  z-index: -1;
}

/* ---- mark ---- */
.brand-mark {
  position: relative;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background:
    linear-gradient(140deg, #ffffff 0%, #eef4ff 45%, #dbe8ff 100%);
  border: 1px solid var(--border-blue);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 6px 18px rgba(37, 99, 235, 0.18),
    0 0 0 4px rgba(37, 99, 235, 0.05);
  overflow: hidden;
  transition: transform .25s ease, box-shadow .25s ease;
}

.brand-mark::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg,
              rgba(37, 99, 235, 0.10),
              rgba(96, 165, 250, 0.05) 50%,
              transparent 80%);
}

.brand-mark:hover {
  transform: translateY(-1px) rotate(-2deg);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 10px 26px rgba(37, 99, 235, 0.28),
    0 0 0 6px rgba(37, 99, 235, 0.06);
}

.brand-glyph {
  position: relative;
  font-size: 22px;
  line-height: 1;
  background: linear-gradient(135deg, var(--blue-1), var(--blue-3));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 1px 1px rgba(37, 99, 235, 0.25));
}

/* orbiting halo dot */
.brand-orbit {
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  pointer-events: none;
  background:
    conic-gradient(from 180deg,
      transparent 0deg,
      rgba(37, 99, 235, 0.55) 60deg,
      transparent 120deg,
      transparent 360deg);
  mask: radial-gradient(farthest-side,
        transparent calc(100% - 2px), #000 calc(100% - 1px));
  -webkit-mask: radial-gradient(farthest-side,
        transparent calc(100% - 2px), #000 calc(100% - 1px));
  animation: orbit 6s linear infinite;
  opacity: 0.85;
}

@keyframes orbit {
  to { transform: rotate(360deg); }
}

/* ---- text ---- */
.brand-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.brand-name {
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: -0.4px;
  line-height: 1.1;
  color: var(--text-primary);
  background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 60%, #2563eb 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

.brand-sub {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: 'SF Mono', 'Fira Code', monospace;
  white-space: nowrap;
}

/* pulsing status dot before subtitle */
.brand-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue-3);
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12), 0 0 10px var(--blue-3);
  animation: brandPulse 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes brandPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}

/* subtle responsive tweak */
@media (max-width: 900px) {
  .brand-mark { width: 42px; height: 42px; border-radius: 12px; }
  .brand-glyph { font-size: 20px; }
  .brand-name { font-size: 14.5px; }
}
  </style>
</head>
<body>

<div class="app">

  <!-- ========================= SIDEBAR ========================= -->
  <aside class="sidebar" id="sidebar">
 <div class="brand">
  <div class="brand-mark">
    <span class="brand-glyph">⚗</span>
    <span class="brand-orbit"></span>
  </div>
  <div class="brand-text">
    <div class="brand-name">SKR </div>
    <div class="brand-sub">
      <span class="brand-dot"></span>
   Full-Stack &amp; Application <br>Developer
    </div>
  </div>
</div>

    <button class="new-chat-btn" onclick="newChat()">
      <span>＋</span> New Chat
    </button>

    <div class="side-toggle" id="webToggle" onclick="toggleWeb()">
      <span>🌐 &nbsp;Web Search</span>
      <span id="webState">OFF</span>
    </div>

    <div class="side-info">
      <b>supports</b><br>
      → text<br>
      → images<br>
      → pdf (ocr + vision)<br>
      <b>renders</b><br>
      → mhchem equations
    </div>
  </aside>

  <!-- ========================= MAIN ========================= -->
  <main class="main">

    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <div class="main-header">
      <div class="main-title">
        <span class="status-dot"></span>
        AI Document Assistant
      </div>
      <div class="main-sub">// upload a chemistry PDF or image — equations come back rendered</div>
    </div>

    <div class="thread" id="thread">
      <!-- messages injected here -->
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <img id="imagePreview" alt="preview">
        <div id="badgeRow" class="badge-row"></div>

        <div class="input-area">
          <button type="button" class="icon-btn"
                  onclick="document.getElementById('fileInput').click()"
                  title="Attach image or PDF">📎</button>

          <input id="fileInput" type="file"
                 accept="image/*,application/pdf"
                 onchange="handleFileSelect()">

          <textarea id="query"
                    placeholder="Ask anything, or drop a chemistry PDF / image to extract equations…"
                    rows="1"></textarea>

          <button id="sendBtn" class="send-btn" onclick="sendMessage()" title="Send">➤</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // ============================================================
  // STATE
  // ============================================================
  let conversationId = null;
  let webSearch = false;
  let attachedFile = null;
  let isGenerating = false;
  let abortController = null;

  const fileInput = document.getElementById('fileInput');
  const imagePreview = document.getElementById('imagePreview');
  const badgeRow = document.getElementById('badgeRow');
  const thread = document.getElementById('thread');
  const sendBtn = document.getElementById('sendBtn');
  const queryInput = document.getElementById('query');
  const webToggle = document.getElementById('webToggle');
  const webState = document.getElementById('webState');
  const sidebar = document.getElementById('sidebar');

  // ============================================================
  // UTIL
  // ============================================================
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMathInto(el) {
    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise([el]).catch(err => console.error(err));
    }
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      thread.scrollTop = thread.scrollHeight;
    });
  }

  function toggleSidebar() { sidebar.classList.toggle('open'); }

  function toggleWeb() {
    webSearch = !webSearch;
    webState.textContent = webSearch ? 'ON' : 'OFF';
    webToggle.classList.toggle('active', webSearch);
  }

  // ============================================================
  // ATTACHMENTS
  // ============================================================
  function handleFileSelect() {
    const file = fileInput.files[0];
    if (!file) return;

    const isImage = file.type.startsWith('image/');
    const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

    if (!isImage && !isPDF) {
      alert('Only images and PDFs are supported.');
      fileInput.value = '';
      return;
    }

    attachedFile = file;
    imagePreview.style.display = 'none';
    badgeRow.innerHTML = '';

    if (isImage) {
      imagePreview.src = URL.createObjectURL(file);
      imagePreview.style.display = 'block';
    }

    const badge = document.createElement('div');
    badge.className = 'file-badge';
    badge.innerHTML = `${isImage ? '🖼' : '📄'} ${escapeHtml(file.name)}
      <button onclick="clearAttachment()" title="Remove">✕</button>`;
    badgeRow.appendChild(badge);
  }

  function clearAttachment() {
    attachedFile = null;
    fileInput.value = '';
    imagePreview.style.display = 'none';
    imagePreview.src = '';
    badgeRow.innerHTML = '';
  }

  // ============================================================
  // THREAD RENDERING
  // ============================================================
  function renderEmptyState() {
    thread.innerHTML = `
      <div class="empty" id="emptyState">
        <div class="empty-icon">⚗</div>
        <h2>How can I help with your document?</h2>
        <p>Upload a chemistry PDF, a photo of a textbook page, or just ask a question. Equations render properly with mhchem.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion(this)">
            <b>Extract equations</b>Pull every chemical equation from an uploaded PDF
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            <b>Explain a reaction</b>Walk me through the mechanism step by step
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            <b>Balance an equation</b>Balance and show states of matter
          </button>
          <button class="suggestion" onclick="useSuggestion(this)">
            <b>Summarise a chapter</b>Give me the key points from this PDF
          </button>
        </div>
      </div>
    `;
  }

  function useSuggestion(btn) {
    const title = btn.querySelector('b').textContent.trim();
    queryInput.value = title + ': ';
    queryInput.focus();
    queryInput.style.height = 'auto';
    queryInput.style.height = Math.min(queryInput.scrollHeight, 180) + 'px';
  }

  function removeEmptyState() {
    const e = document.getElementById('emptyState');
    if (e) e.remove();
  }

  function addUserMessage(text, attachment) {
    removeEmptyState();
    const msg = document.createElement('div');
    msg.className = 'msg user';

    let attachHtml = '';
    if (attachment) {
      attachHtml = `<div class="bubble-attachments">
        <span class="att-chip">${attachment.isImage ? '🖼' : '📄'} ${escapeHtml(attachment.name)}</span>
      </div>`;
      if (attachment.isImage && attachment.previewUrl) {
        attachHtml += `<img class="bubble-img" src="${attachment.previewUrl}" alt="">`;
      }
    }

    msg.innerHTML = `
      <div class="avatar">›_</div>
      <div class="bubble-wrap">
        <div class="bubble">${escapeHtml(text).replace(/\n/g, '<br>')}${attachHtml}</div>
      </div>
    `;
    thread.appendChild(msg);
    scrollToBottom();
  }

  // ============================================================
  // AI MESSAGE
  // ============================================================
  function addAIMessage() {
    removeEmptyState();
    const msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = `
      <div class="avatar">⚗</div>
      <div class="bubble-wrap">
        <div class="bubble">
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="msg-tools" style="display:none;">
          <button class="tool-btn">📋 copy</button>
        </div>
      </div>
    `;

    const bubble = msg.querySelector('.bubble');
    const tools  = msg.querySelector('.msg-tools');
    const copyBtn = msg.querySelector('.tool-btn');

    copyBtn.addEventListener('click', () => {
      const text = bubble.dataset.raw || bubble.innerText;
      navigator.clipboard.writeText(text).then(() => {
        const old = copyBtn.textContent;
        copyBtn.textContent = '✓ copied';
        setTimeout(() => { copyBtn.textContent = old; }, 1400);
      });
    });

    thread.appendChild(msg);
    scrollToBottom();

    return { bubble, tools, msg };
  }

  function setAIBubbleStatus(bubble, text) {
    if (!bubble) return;
    bubble.innerHTML = `
      <div class="extract-status">
        <span class="spinner"></span>
        <span>${escapeHtml(text)}</span>
      </div>
    `;
    scrollToBottom();
  }

  function setAIBubbleContent(bubble, toolsEl, html, rawText) {
    if (!bubble) return;
    bubble.innerHTML = html;
    bubble.dataset.raw = rawText || '';
    renderMathInto(bubble);
    if (toolsEl) toolsEl.style.display = 'flex';
    scrollToBottom();
  }

  function setAIBubbleError(bubble, text) {
    if (!bubble) return;
    bubble.innerHTML = `<div style="color:#dc2626;">✗ ${escapeHtml(text)}</div>`;
    scrollToBottom();
  }

  function makeExtractBox(label, content) {
    const safe = escapeHtml(content || '(empty)');
    const id = 'ex-' + Math.random().toString(36).slice(2, 9);
    return `
      <div class="extract-box" id="${id}">
        <div class="extract-head" onclick="document.getElementById('${id}').classList.toggle('open')">
          <span class="left">▸ ${escapeHtml(label)}</span>
          <span class="chev">▶</span>
        </div>
        <div class="extract-body"><pre>${safe}</pre></div>
      </div>
    `;
  }

  // ============================================================
  // SEND
  // ============================================================
  async function sendMessage() {
    const query = queryInput.value.trim();

    if (!query && !attachedFile) { queryInput.focus(); return; }
    if (isGenerating) return;

    isGenerating = true;
    setSendState('stop');

    const attachmentSnapshot = attachedFile ? {
      name: attachedFile.name,
      isImage: attachedFile.type.startsWith('image/'),
      previewUrl: attachedFile.type.startsWith('image/')
        ? URL.createObjectURL(attachedFile)
        : null,
      file: attachedFile,
    } : null;

    const userText = query || 'Extract and format every chemical formula and equation in the document.';

    addUserMessage(userText, attachmentSnapshot);
    queryInput.value = '';
    queryInput.style.height = 'auto';

    const { bubble, tools } = addAIMessage();
    abortController = new AbortController();

    try {
      let extractedPreview = null;

      if (attachmentSnapshot) {
        clearAttachment();
        setAIBubbleStatus(bubble, 'extracting document…');

        const fd = new FormData();
        fd.append('file', attachmentSnapshot.file);
        if (conversationId) fd.append('conversation_id', conversationId);

        const upRes = await fetch('/upload', {
          method: 'POST',
          body: fd,
          signal: abortController.signal,
        });
        const upData = await upRes.json();

        if (upData.error) {
          setAIBubbleError(bubble, upData.error);
          return;
        }

        conversationId = upData.conversation_id;
        extractedPreview = upData.text || '';
        setAIBubbleStatus(bubble, 'reading document…');
      }

      setAIBubbleStatus(bubble, 'thinking…');

      const payload = {
        message: userText,
        conversation_id: conversationId,
        web_search: webSearch,
      };

      const chatRes = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: abortController.signal,
      });
      const chatData = await chatRes.json();

      if (chatData.error) {
        setAIBubbleError(bubble, chatData.error);
        return;
      }

      conversationId = chatData.conversation_id;
      const answer = chatData.answer || '';

      let html = escapeHtml(answer).replace(/\n/g, '<br>');

      if (extractedPreview && extractedPreview.trim().length > 0) {
        html += makeExtractBox(
          'extracted text from document',
          extractedPreview.length > 4000
            ? extractedPreview.slice(0, 4000) + '\n…[truncated]'
            : extractedPreview
        );
      }

      setAIBubbleContent(bubble, tools, html, answer);

    } catch (err) {
      if (err.name === 'AbortError') {
        setAIBubbleError(bubble, 'generation stopped by user.');
      } else {
        console.error(err);
        setAIBubbleError(bubble, 'Something went wrong. Please try again.');
      }
    } finally {
      isGenerating = false;
      abortController = null;
      setSendState('send');
    }
  }

  function setSendState(mode) {
    if (mode === 'stop') {
      sendBtn.classList.add('stop');
      sendBtn.innerHTML = '⏹';
      sendBtn.disabled = false;
      sendBtn.onclick = stopGeneration;
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.innerHTML = '➤';
      sendBtn.disabled = false;
      sendBtn.onclick = sendMessage;
    }
  }

  function stopGeneration() {
    if (abortController) abortController.abort();
  }

  async function newChat() {
    try {
      const res = await fetch('/new-chat', { method: 'POST' });
      const data = await res.json();
      conversationId = data.conversation_id;
    } catch (e) { console.warn('New chat failed:', e); }
    clearAttachment();
    queryInput.value = '';
    queryInput.style.height = 'auto';
    renderEmptyState();
  }

  queryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  queryInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 180) + 'px';
  });

  (async () => {
    try {
      const res = await fetch('/new-chat', { method: 'POST' });
      const data = await res.json();
      conversationId = data.conversation_id;
    } catch (e) { console.warn('Init failed.'); }
    renderEmptyState();
  })();
</script>
</body>
</html>
